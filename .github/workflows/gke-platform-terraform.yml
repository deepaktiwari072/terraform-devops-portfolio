name: GKE Platform Terraform

on:
  # Manual execution prevents costly GKE resources from being created
  # automatically after every push 
  workflow_dispatch:
    inputs:
      terraform_action:
          description:  "Terraform operation to execute"
          required: true
          type: choice
          options:
            - plan
            - apply
            - destroy
          default: plan
permissions:
    # Allows GitHub action to read respository terraform files.
    contents: read

    # Allow Github to request an OIDC toekn for GCP authentication

    id-token: write

env:
    TF_WORKING_DIR: GCP/05-gcp-gke-argocd-cicd-modules
    TF_VAR_FILE: terraform.tfvars
jobs:
  terraform:
      name: Terraform ${{ inputs.terraform_action }}
      runs-on: ubuntu-latest

      defaults:
        run:
            working-directory:  ${{ vars.TF_WORKING_DIR }}
      steps:
        - name: checkout respository
          uses: action/checkout@v4
          # Authenticatesto GCP using WIF instead of service account JSON key
        - name: authenticate to Google Cloud
          uses: google-github-action/auth@v3
          with:
              workload_identity_provider : ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
              service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
        
        - name: Terraform format checkout
          uses: terraform fmt -check -recursive

        - name: Terraform initialize
          run: terraform init

        - name: Terrafrom validate
          run: terrafrom validate
        
        - name: terraform plan
          if: inputs.terraform_action == 'plan'
          run: terraform plan -var-file="${TF_VAR_FILE}"

        - name: Terraform apply
          if: inputs.terraform_action == 'apply'
          run: terrafom apply -auto-approve -var-file="${TF_VAR_FILE}"

        - name: Terrafom destroy
          if: inputs.terraform_action = 'destroy'
          run: terraform destroy -auto-approve -var-file="${TF_VAR_FILE}"